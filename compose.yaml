services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - alloy
    volumes:
      - nginx-logs:/var/log/nginx

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4
    command:
      - --nginx.scrape-uri=http://app/nginx_status
    depends_on:
      - app
    ports:
      - "9113:9113"

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro,Z
      - alloy-data:/var/lib/alloy/data
      - nginx-logs:/var/log/nginx:ro
    depends_on:
      - loki
      - tempo
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.4.2
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./docker/loki/config.yml:/etc/loki/config.yml:ro,Z
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.7.1
    command:
      - -config.file=/etc/tempo/config.yml
    volumes:
      - ./docker/tempo/config.yml:/etc/tempo/config.yml:ro,Z
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3000:3000"

volumes:
  alloy-data:
  grafana-data:
  loki-data:
  nginx-logs:
  prometheus-data:
  tempo-data:
