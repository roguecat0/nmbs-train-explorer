load_module modules/ngx_otel_module.so;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  otel_exporter {
    endpoint alloy:4317;
    interval 1s;
  }

  otel_service_name nmbs-train-explorer-nginx;
  otel_resource_attr deployment.environment local;

  log_format otel_json escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"trace_id":"$otel_trace_id",'
      '"span_id":"$otel_span_id"'
    '}';

  access_log /var/log/nginx/otel_access.log otel_json;
  error_log /var/log/nginx/otel_error.log warn;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /nginx_status {
      stub_status;
      access_log off;
    }

    location /assets/ {
      otel_trace on;
      otel_trace_context propagate;
      otel_span_name "$request_method $uri";
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / {
      otel_trace on;
      otel_trace_context propagate;
      otel_span_name "$request_method $uri";
      try_files $uri $uri/ /index.html;
    }
  }
}
