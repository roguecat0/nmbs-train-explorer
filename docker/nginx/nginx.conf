events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  map $cookie_nmbs_visitor_id $visitor_id {
    "" $request_id;
    default $cookie_nmbs_visitor_id;
  }

  map $cookie_nmbs_visitor_id $visitor_cookie {
    "" "nmbs_visitor_id=$visitor_id; Path=/; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax";
    default "";
  }

  map $uri $log_type {
    ~^/events/repair-started/ repair_started;
    ~^/events/repair-completed/ repair_completed;
    default http_request;
  }

  log_format render_json escape=json
    '{'
      '"type":"$log_type",'
      '"method":"$request_method",'
      '"path":"$request_uri",'
      '"status":$status,'
      '"duration_ms":$request_time,'
      '"bytes":$body_bytes_sent,'
      '"request_id":"$http_rndr_id",'
      '"visitor_id":"$visitor_id",'
      '"client_ip":"$http_x_forwarded_for",'
      '"user_agent":"$http_user_agent"'
    '}';

  access_log /dev/stdout render_json;
  access_log syslog:server=127.0.0.1:1514,facility=local7,tag=nginx,severity=info render_json;
  error_log /dev/stderr warn;

  server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Set-Cookie $visitor_cookie always;

    location ~ ^/events/repair-(started|completed)/(drivers-cab|headlights|brake-system|wheels|passenger-doors|roof-ventilation)$ {
      if ($request_method != POST) {
        return 405;
      }

      return 204;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header Set-Cookie $visitor_cookie always;
      try_files $uri =404;
    }

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
